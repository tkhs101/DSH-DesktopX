<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重启中</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Same card language as the splash: white, rounded, hairline border, soft shadow. */
  .card {
    display: flex;
    align-items: center;
    gap: 13px;
    /* Card is inset 14px inside the toast window so the shadow has room;
       without this the blur gets clipped into a hard rectangular edge. */
    width: calc(100vw - 28px);
    height: calc(100vh - 28px);
    padding: 0 16px;
    background: #ffffff;
    border: 1px solid #e4e9f2;
    border-radius: 14px;
    box-shadow:
      0 2px 6px rgba(30, 58, 120, 0.07),
      0 6px 16px rgba(30, 58, 120, 0.12);
    animation: pop 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Same ring as the splash, scaled down for the toast. */
  .ring { flex: 0 0 auto; width: 30px; height: 30px; }
  .ring svg { display: block; width: 100%; height: 100%; }
  .ring .arc {
    transform-box: view-box;
    transform-origin: 50% 50%;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .text { min-width: 0; }
  .title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #333c4e;
    white-space: nowrap;
  }
  .sub {
    margin-top: 3px;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: #8a94a6;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ring" role="status" aria-label="正在重启">
      <svg viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="13" stroke="#3f8cff" stroke-opacity="0.16" stroke-width="3.5"/>
        <path class="arc" d="M15 2 A13 13 0 0 1 28 15" stroke="#3f8cff" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="text">
      <div class="title">正在重启后端…</div>
      <div class="sub">请等待自动刷新</div>
    </div>
  </div>
</body>
</html>
